	<script>
	if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
		const watched = [location.pathname, 'css/style.css', 'js/main.js'];
		const lastModified = {};
		setInterval(async () => {
			for (const url of watched) {
				try {
					const res = await fetch(url, { method: 'HEAD', cache: 'no-store' });
					const lm = res.headers.get('last-modified');
					if (lm) {
						if (lastModified[url] && lastModified[url] !== lm) { location.reload(); return; }
						lastModified[url] = lm;
					}
				} catch (e) {}
			}
		}, 1000);
	}
